name: Render Mentoring SST preview image
on:
  push:
    branches: [main]
    paths:
      - og-mentoring.svg
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Convert vector social artwork to PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin
          rsvg-convert --width 1200 --height 630 --output og-mentoring.png og-mentoring.svg
          file og-mentoring.png
      - name: Publish generated PNG to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-mentoring.png
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar imagen social PNG de Mentoring SST Plus"
            git push
          fi
