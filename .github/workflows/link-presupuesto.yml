name: Integrate corporate training link

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add corporate training bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          url = 'https://presupuesto.movidasst.com/'
          if url not in text:
              # Desktop navigation, same tab.
              nav_anchor = '<a href="#faq">FAQ</a><a class="btn primary" href="#agendar">Agendar</a>'
              nav_new = '<a href="#faq">FAQ</a><a href="https://presupuesto.movidasst.com/">Capacitación empresas</a><a class="btn primary" href="#agendar">Agendar</a>'
              if nav_anchor not in text:
                  raise SystemExit('No se encontró navegación principal')
              text = text.replace(nav_anchor, nav_new, 1)

              # Commercial bridge before FAQ.
              marker = '<section class="section white" id="faq">'
              bridge = '''<section class="section soft" id="capacitacion-empresas"><div class="container"><div class="card" style="border:1px solid #cbe8e8;background:linear-gradient(135deg,#ffffff,#f0f9f8)"><p class="eyebrow">Soluciones para empresas</p><h2 style="font-size:clamp(1.7rem,5vw,2.5rem)">¿Lo que necesitas es capacitar a todo tu equipo?</h2><p class="lead">Para cohortes de trabajadores, cursos SST, seguimiento, certificados e informes de avance, utiliza la oferta de Capacitación Corporativa de la Academia Movida SST.</p><a class="btn primary" href="https://presupuesto.movidasst.com/">Cotizar capacitación corporativa →</a></div></div></section>'''
              if marker not in text:
                  raise SystemExit('No se encontró FAQ')
              text = text.replace(marker, bridge + '\n' + marker, 1)

              # Footer cross-link, same tab.
              footer_anchor = '<a href="https://www.movidasst.com/" target="_blank">La Movida SST</a>'
              footer_new = '<a href="https://www.movidasst.com/" target="_blank">La Movida SST</a><a href="https://presupuesto.movidasst.com/">Capacitación corporativa</a>'
              if footer_anchor in text:
                  text = text.replace(footer_anchor, footer_new, 1)

              path.write_text(text, encoding='utf-8')
          PY
      - name: Verify same-tab integration
        run: |
          grep -q 'https://presupuesto.movidasst.com/' index.html
          grep -q 'Cotizar capacitación corporativa' index.html
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          assert '<a href="https://presupuesto.movidasst.com/">Capacitación empresas</a>' in text
          assert 'href="https://presupuesto.movidasst.com/" target="_blank"' not in text
          PY
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: connect Mentoring SST with corporate training"
          git push
